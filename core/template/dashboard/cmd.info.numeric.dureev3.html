<div class="tooltips cmd cmd-widget #history#" data-type="info" data-subtype="numeric" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#" style="display: block;">
	<center><span style="font-size : 12px !important;#hideCmdName#" class="cmdName">#name_display#</span> <strong class="state" style="font-size: 12px;"></strong></center>
	<script>
		jeedom.cmd.update['#id#'] = function(_options){
			var duree = _options.display_value;
			var j = Math.floor(duree/86400); duree %= 86400;
			var h = Math.floor(duree/3600); duree %= 3600;
			var m = Math.floor(duree/60);
			var s = duree%60;
			var txt = '';
			if (j) txt += j + '{{j}} ';
			if (h) txt += h + '{{h}} ';
			if (m) txt += m + '{{min}} ';
			if (s) txt += s + '{{s}} ';
			var cmd = document.querySelector('.cmd[data-cmd_uid=#uid#]');
			if (cmd) {
				cmd.setAttribute('title', '{{Valeur du}}' + _options.valueDate + ', {{collectée le}}' + _options.collectDate);
			}
			var stateEl = document.querySelector('.cmd[data-cmd_uid=#uid#] .state');
			if (stateEl) {
				stateEl.innerHTML = txt + ' (' + _options.display_value + '#unite#)';
			}
			if(_options.alertLevel){
				if(_options.alertLevel == 'warning'){
					if (cmd) {
						cmd.classList.add('label', 'label-warning');
						cmd.classList.remove('label-danger');
					}
				}else if(_options.alertLevel == 'danger'){
					if (cmd) {
						cmd.classList.add('label', 'label-danger');
						cmd.classList.remove('label-warning');
					}
				}
			}
		}
		jeedom.cmd.update['#id#']({display_value:'#state#',valueDate:'#valueDate#',collectDate:'#collectDate#',alertLevel:'#alertLevel#'});
	</script>
</div>
